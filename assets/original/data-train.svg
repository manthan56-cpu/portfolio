<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" fill="none">
  <!-- connector bars -->
  <g stroke="#090909" stroke-width="12" stroke-linecap="round">
    <path d="M330 130 H372"/>
    <path d="M700 130 H742"/>
  </g>

  <g stroke="#090909" stroke-width="9" stroke-linejoin="round">
    <path d="M20 60 H300 Q330 60 330 96 V168 Q330 194 300 194 H20 Q0 194 0 168 V96 Q0 60 20 60 Z" fill="#a1001a"/>
    <rect x="372" y="60" width="328" height="134" rx="22" fill="#f5edd8"/>
    <rect x="742" y="60" width="298" height="134" rx="22" fill="#103b8e"/>
  </g>

  <!-- windows -->
  <g fill="#f5c928">
    <rect x="42" y="92" width="52" height="44" rx="8"/>
    <rect x="110" y="92" width="52" height="44" rx="8"/>
    <rect x="178" y="92" width="52" height="44" rx="8"/>
  </g>
  <g fill="#103b8e">
    <rect x="400" y="92" width="52" height="44" rx="8"/>
    <rect x="468" y="92" width="52" height="44" rx="8"/>
    <rect x="536" y="92" width="52" height="44" rx="8"/>
    <rect x="604" y="92" width="52" height="44" rx="8"/>
  </g>
  <g fill="#f5edd8">
    <rect x="770" y="92" width="52" height="44" rx="8"/>
    <rect x="838" y="92" width="52" height="44" rx="8"/>
    <rect x="906" y="92" width="52" height="44" rx="8"/>
    <rect x="974" y="92" width="52" height="44" rx="8"/>
  </g>

  <!-- status stripe -->
  <g stroke-width="10" stroke-linecap="round">
    <path d="M42 160 H246" stroke="#f5edd8"/>
    <path d="M400 160 H672" stroke="#a1001a"/>
    <path d="M770 160 H1010" stroke="#fbff00"/>
  </g>

  <!-- nose -->
  <g stroke="#090909" stroke-width="9" stroke-linejoin="round">
    <path d="M1040 60 L1120 96 V168 L1040 194 Z" fill="#f5c928"/>
  </g>

  <!-- wheels -->
  <g stroke="#090909" stroke-width="8">
    <circle cx="90" cy="208" r="18" fill="#090909"/>
    <circle cx="250" cy="208" r="18" fill="#090909"/>
    <circle cx="430" cy="208" r="18" fill="#090909"/>
    <circle cx="640" cy="208" r="18" fill="#090909"/>
    <circle cx="800" cy="208" r="18" fill="#090909"/>
    <circle cx="990" cy="208" r="18" fill="#090909"/>
  </g>
</svg>
